name: Continuous integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'meta/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'meta/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build-and-test-jvm:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the APK to the "latest" release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make sure Gradle wrapper is legitimate
        uses: gradle/actions/wrapper-validation@v5

      - name: Create and checkout branch that will be used as app name
        # push events already checked out the branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: git checkout -B "$BRANCH"

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Build debug APK and run jvm tests
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app
          path: app/build/outputs/apk/debug/*.apk

      # personal fork: also publish the APK as a plain file that can be downloaded and installed
      # directly on the phone, without signing in to GitHub or unpacking a zip
      - name: Publish APK to the "latest" release
        if: github.repository != 'Stypox/dicio-android'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cp app/build/outputs/apk/debug/*.apk dicio-ai.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Latest build" \
            --notes "Newest build of Dicio AI. Download dicio-ai.apk on your phone and tap it to install." \
            --prerelease --target "$TARGET_SHA"
          gh release upload latest dicio-ai.apk --clobber
